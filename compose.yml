services:
  postgres:
    image: postgres:17-alpine
    container_name: hotel-reservation-db
    environment:
      POSTGRES_DB: hotel_reservation
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_password
    ports:
      - "5432:5432"
    volumes:
      - hotel_reservation_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_user -d hotel_reservation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hotel_reservation_data: